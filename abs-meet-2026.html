<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABS Meet 2026 | ABS Hyderabad Chapter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #f5f6fa;
            padding: 20px;
            line-height: 1.6;
            color: #333;
        }
        .main-title {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .event-date {
            text-align: center;
            color: #2c3e50;
            font-size: 1em;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 1100px;
            margin: 20px auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .back-wrap { max-width: 1100px; margin: 0 auto 15px; }
        .back-btn {
            display: inline-block;
            background: #3498db;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            transition: transform .2s, box-shadow .2s;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,.15); }
        .section-title {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            margin: 35px 0 25px;
            color: #1a1a1a;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }
        .gallery-item {
            background: #f5f6fa;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,.08);
            transition: transform .2s, box-shadow .2s;
        }
        .gallery-item:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.14); }
        .gallery-item img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }
        .pdf-card { padding-bottom: 25px; }
        .pdf-frame {
            width: 100%;
            height: 800px;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: block;
            background: white;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(0,0,0,.85);
            justify-content: center;
            align-items: center;
            padding: 30px;
        }
        .modal-content { max-width: 92%; max-height: 90%; object-fit: contain; border-radius: 5px; }
        .close {
            position: absolute;
            top: 15px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .main-title { font-size: 1.4em; }
            .card { padding: 20px; }
            .gallery { grid-template-columns: 1fr; }
            .gallery-item img { height: auto; max-height: 500px; object-fit: contain; }
            .pdf-frame { height: 650px; }
        }
        @media (min-width: 769px) and (max-width: 950px) {
            .gallery { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="back-wrap">
        <a class="back-btn" href="index.html">← Back to ABS Hyderabad Chapter</a>
    </div>

    <h1 class="main-title">ABS MEET 2026</h1>
    <p class="event-date">Association of British Scholars : Hyderabad Chapter</p>

    <h2 class="section-title">Photo Gallery</h2>
    <div class="card">
        <div class="gallery">
            <div class="gallery-item" onclick="openModal('abs-meet-2026/gallery/WhatsApp%20Image%202026-09-17%20at%2012.24.14%20PM.jpeg')">
                <img src="abs-meet-2026/gallery/WhatsApp%20Image%202026-09-17%20at%2012.24.14%20PM.jpeg" alt="ABS Meet 2026 photo 1">
            </div>
            <div class="gallery-item" onclick="openModal('abs-meet-2026/gallery/2.jpeg')">
                <img src="abs-meet-2026/gallery/2.jpeg" alt="ABS Meet 2026 photo 2">
            </div>
            <div class="gallery-item" onclick="openModal('abs-meet-2026/gallery/3.jpeg')">
                <img src="abs-meet-2026/gallery/3.jpeg" alt="ABS Meet 2026 photo 3">
            </div>
            <div class="gallery-item" onclick="openModal('abs-meet-2026/gallery/4.jpeg')">
                <img src="abs-meet-2026/gallery/4.jpeg" alt="ABS Meet 2026 photo 4">
            </div>
            <div class="gallery-item" onclick="openModal('abs-meet-2026/gallery/5.jpeg')">
                <img src="abs-meet-2026/gallery/5.jpeg" alt="ABS Meet 2026 photo 5">
            </div>
            <div class="gallery-item" onclick="openModal('abs-meet-2026/gallery/6.jpeg')">
                <img src="abs-meet-2026/gallery/6.jpeg" alt="ABS Meet 2026 photo 6">
            </div>
        </div>
    </div>

    <h2 class="section-title">Talk by Dr. T. Harinarayana</h2>
    <div class="card pdf-card">
        <iframe class="pdf-frame" src="abs-meet-2026/my%20talk%20on%2012-9-26.pdf" title="My Talk - 12 September 2026">
            Your browser does not support embedded PDFs. Please open the PDF directly.
        </iframe>
    </div>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage" alt="Expanded gallery image">
    </div>

    <script>
        function openModal(imageSrc) {
            document.getElementById('imageModal').style.display = 'flex';
            document.getElementById('modalImage').src = imageSrc;
        }
        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
            document.getElementById('modalImage').src = '';
        }
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
